name: webui

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      verify_handoff:
        description: Verify the plugin handoff credentials without releasing
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'workflow_dispatch' || !inputs.verify_handoff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: tests/fixture/go.mod
          cache: false
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5
      - run: npm ci
      - run: npm run check
      - name: Package committed source
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            [[ $GITHUB_REF_NAME == "v$version" ]]
          fi
          npm run release -- "$version"
      - name: Install tested Syncthing
        run: |
          curl -fsSL https://github.com/syncthing/syncthing/releases/download/v2.1.3/syncthing-linux-amd64-v2.1.3.tar.gz -o "$RUNNER_TEMP/syncthing.tar.gz"
          echo "f929eb8e5b72a85543eeeefb2c38f34a68e0c530e70758a2905b78840c76602c  $RUNNER_TEMP/syncthing.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/syncthing.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/syncthing-linux-amd64-v2.1.3" >> "$GITHUB_PATH"
      - run: npx playwright install --with-deps chromium
      - name: Test installed release
        run: bash scripts/test-release.sh "$PWD"/release/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: webui-release
          path: release/*
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-failures
          path: test-results/

  handoff-credentials:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.verify_handoff
    runs-on: ubuntu-latest
    steps:
      - name: Create plugin installation token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app
        with:
          app-id: ${{ vars.SYNCSHELL_APP_ID }}
          private-key: ${{ secrets.SYNCSHELL_APP_PRIVATE_KEY }}
          owner: omarchy-QOL
          repositories: syncshell
          permission-contents: write
      - name: Verify plugin repository access
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run:
          test "$(gh api repos/omarchy-QOL/syncshell --jq .full_name)" =
          "omarchy-QOL/syncshell"

  publish:
    needs: [test, handoff-credentials]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: webui-release
          path: release
      - name: Publish tested archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run:
          gh release create "$RELEASE_TAG" release/* --verify-tag
          --generate-notes

  notify-plugin:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: webui-release
          path: release
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app
        with:
          app-id: ${{ vars.SYNCSHELL_APP_ID }}
          private-key: ${{ secrets.SYNCSHELL_APP_PRIVATE_KEY }}
          owner: omarchy-QOL
          repositories: syncshell
          permission-contents: write
      - name: Notify pinned plugin update
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          checksum=$(cut -d ' ' -f 1 release/*.sha256)
          gh api repos/omarchy-QOL/syncshell/dispatches \
            -f event_type=webui-release \
            -f "client_payload[version]=${RELEASE_TAG#v}" \
            -f "client_payload[sha256]=$checksum"
